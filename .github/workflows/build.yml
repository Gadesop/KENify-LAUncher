name: Build Kenify Launcher APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: "/usr/local/lib/android/sdk/ndk/26.3.11579264"
      ANDROID_NDK_ROOT: "/usr/local/lib/android/sdk/ndk/26.3.11579264"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK 26 and Delete NDK 27
      run: |
        yes | sdkmanager "ndk;26.3.11579264"
        yes | sdkmanager "cmake;3.22.1"
        # DELETE THE BROKEN NDK 27 SO GRADLE CAN'T USE IT
        rm -rf /usr/local/lib/android/sdk/ndk/27.0.12077973

    - name: Find and Build APK
      run: |
        GRADLEW=$(find . -name "gradlew" -type f | head -n 1)
        echo "Found gradlew at: $GRADLEW"
        GRADLE_DIR=$(dirname "$GRADLEW")
        cd "$GRADLE_DIR"
        chmod +x ./gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Kenify-Launcher-APK
        path: "**/build/outputs/apk/debug/*.apk"
